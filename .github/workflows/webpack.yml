name: NodeJS with Webpack

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build npm install @capacitor/core @capacitor/cli

    run: npx cap open 
        npm install  install @capacitor/android @capacitor/ios
npx cap add android
npx cap add ios
npm install @capacitor-community/bluetooth-le @install -g freebuff
npx cap sync
        npx webpack 
