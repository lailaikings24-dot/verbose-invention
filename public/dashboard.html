<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TorqueMedic Dashboard</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent-blue: #38bdf8;
      --accent-green: #4ade80;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .dashboard-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Connection Status Header */
    .status-bar {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #334155;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }

    .dot {
      width: 12px;
      height: 12px;
      background-color: var(--accent-red);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-red);
      transition: all 0.3s ease;
    }

    .dot.connected {
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    .btn-action {
      background-color: var(--accent-blue);
      color: var(--bg-dark);
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Telemetry Gauges Layout */
    .telemetry-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .gauge-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      border: 1px solid #334155;
    }

    .gauge-value {
      font-size: 2.5rem;
      font-weight: 800;
      color: var(--text-main);
      margin: 10px 0 2px 0;
    }

    .gauge-unit {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Diagnostics & DTC section */
    .diagnostics-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid #334155;
    }

    .diagnostics-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .diagnostics-header h3 {
      margin: 0;
      font-size: 1.2rem;
    }

    .dtc-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dtc-item {
      background: #273549;
      padding: 10px 14px;
      border-radius: 8px;
      border-left: 4px solid var(--accent-red);
      display: flex;
      justify-content: space-between;
    }

    .dtc-code {
      font-family: monospace;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .no-faults {
      color: var(--accent-green);
      text-align: center;
      padding: 10px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="dashboard-container">
    
    <!-- Top Action / Status Bar -->
    <div class="status-bar">
      <div class="status-indicator">
        <div id="statusDot" class="dot"></div>
        <span id="statusText">Disconnected</span>
      </div>
      <button id="connectBtn" class="btn-action">Scan & Connect</button>
    </div>

    <!-- Live Telemetry Gauges -->
    <div class="telemetry-grid">
      <div class="gauge-card">
        <div class="gauge-unit">Engine Speed</div>
        <div id="rpmValue" class="gauge-value">0</div>
        <div class="gauge-unit" style="color: var(--accent-blue)">RPM</div>
      </div>
      
      <div class="gauge-card">
        <div class="gauge-unit">Vehicle Speed</div>
        <div id="speedValue" class="gauge-value">0</div>
        <div class="gauge-unit" style="color: var(--accent-green)">KM/H</div>
      </div>
    </div>

    <!-- Diagnostic Trouble Codes Profile -->
    <div class="diagnostics-card">
      <div class="diagnostics-header">
        <h3>System Diagnostics</h3>
        <button id="scanDtcBtn" class="btn-action" style="background: #475569; color: white;" disabled>Read Faults</button>
      </div>
      
      <div id="dtcContainer" class="dtc-list">
        <div class="no-faults">No adapter connected. Perform scan to query ecu diagnostics.</div>
      </div>
    </div>

  </div>

  <!-- Dynamic Logic Linking Modules together -->
  <script type="module" src="dashboard.js"></script>
</body>
</html>
